services:
  - type: web
    name: telegram-summarizer-bot
    env: docker
    plan: free
    healthCheckPath: /
    envVars:
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: DATABASE_PATH
        value: ./data/messages.db
      - key: LOG_LEVEL
        value: INFO
