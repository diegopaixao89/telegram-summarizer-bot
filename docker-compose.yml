version: '3.8'

services:
  telegram-bot:
    build: .
    container_name: telegram-summarizer-bot
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      # Persistir banco de dados
      - ./data:/app/data
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
